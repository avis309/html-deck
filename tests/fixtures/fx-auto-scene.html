<!DOCTYPE html>
<!-- FX fixture: a scene on an ancestor of the slides; Animate this slide adds nothing inside -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>FX auto scene fixture</title>
<style>body { margin: 0; } .slide { width: 1280px; height: 720px; }</style>
</head>
<body>
<main class="deck" data-fx-scene="deckwide">
  <section class="slide"><h1 id="s-h">Scene slide</h1><p>Words</p></section>
  <section class="slide"><h1>Second</h1></section>
</main>
</body>
</html>
