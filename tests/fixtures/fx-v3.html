<!DOCTYPE html>
<!-- FX fixture: an FX v3 file using a v4 preset (wipe) and a v3 one (pop) -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>FX v3 fixture</title>
</head>
<body>
<h1 id="v-wipe" data-fx="wipe">Wiped in</h1>
<p id="v-pop" data-fx="pop">Popped in</p>
<p id="v-clip" style="clip-path: inset(0 10px 0 0)">Clipped by its author</p>
<script data-htmldeck-fx="3">/* stand-in for an FX v3 runtime block */</script>
</body>
</html>
