<!DOCTYPE html>
<!-- FX fixture: a page (not a deck); its sections and loose blocks are revealed one by one as they scroll in -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>FX auto page fixture</title>
<style>body { margin: 0 auto; max-width: 800px; font: 16px/1.5 sans-serif; } section { min-height: 400px; }</style>
</head>
<body>
<section><h2 id="p-a">Part A</h2><p id="p-a2">First part words.</p></section>
<section><h2 id="p-b">Part B</h2><p id="p-b2">Second part words.</p></section>
<p id="p-loose1">A loose paragraph.</p>
<p id="p-loose2">Another loose paragraph.</p>
</body>
</html>
