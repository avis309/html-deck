<head>
<meta charset="utf-8">
<title>FX typo fixture</title>
</head>
<body>
<p id="t1" data-fx="fade-upp">Typo effect</p>
<script data-htmldeck-fx="2">/* stand-in for an FX v2 runtime block */</script>
</body>
</html>
