<!DOCTYPE html>
<!-- FX fixture: the slide itself already has an effect; Animate this slide adds nothing inside -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>FX auto scope fixture</title>
<style>body { margin: 0; } .slide { width: 1280px; height: 720px; }</style>
</head>
<body>
<main class="deck">
  <section class="slide" data-fx="fade-up"><h1 id="a-h">Animated slide</h1><p>Words</p></section>
  <section class="slide"><h1>Second</h1></section>
</main>
</body>
</html>
