name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches every manifest
        run: python tools/bump_version.py --check "${GITHUB_REF_NAME#v}"
      - run: python -m pip install -e ".[dev]" build
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1   # trusted publishing needs npm >= 11.5
      - name: Publish unless this version is already on npm (the first one is published by hand)
        run: |
          v="${GITHUB_REF_NAME#v}"
          if npm view "@avis309/htmldeck@$v" version >/dev/null 2>&1; then
            echo "@avis309/htmldeck@$v is already on npm, skipping"
          else
            npm publish --provenance --access public
          fi
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}   # unused once Trusted Publisher is configured

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history and tags: notes cover the commits since the previous tag
      # Notes from the Conventional Commits since the previous tag (feat/fix/perf/docs; see cliff.toml).
      - uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # The plugin the marketplace and the plugin directory install: only what it runs (tools/build_plugin.py),
  # on its own branch, so the dev tooling's lockfile never makes an install run npm ci.
  plugin-branch:
    needs: github-release
    runs-on: ubuntu-latest
    # One publish at a time; an older release finishing late never replaces a newer tree (below).
    concurrency:
      group: plugin-branch
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Publish the plugin tree to the plugin branch
        run: |
          tree="$RUNNER_TEMP/plugin" branch="$RUNNER_TEMP/branch"
          python tools/build_plugin.py --out "$tree"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin plugin >/dev/null; then
            git fetch -q origin plugin
            git worktree add -q --detach "$branch" origin/plugin
          else
            git worktree add -q --detach "$branch"
            git -C "$branch" checkout -q --orphan plugin
          fi
          version() { python -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' "$1/.claude-plugin/plugin.json"; }
          if [ -f "$branch/.claude-plugin/plugin.json" ] && ! python -c 'import sys; o, n = (tuple(map(int, v.split("."))) for v in sys.argv[1:]); sys.exit(n < o)' "$(version "$branch")" "$(version "$tree")"; then
            echo "the plugin branch already holds $(version "$branch"), newer than $(version "$tree"): left as it is"
            exit 0
          fi
          git -C "$branch" rm -rqf --ignore-unmatch .
          cp -a "$tree/." "$branch/"
          git -C "$branch" add -A
          git -C "$branch" commit -qm "htmldeck plugin $GITHUB_REF_NAME" || echo "plugin tree unchanged"
          git -C "$branch" push -q origin HEAD:refs/heads/plugin
